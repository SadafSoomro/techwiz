<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FANDOM VERSE - Your Fandom. All in One Place.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FANDOM VERSE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FANDOM VERSE</title>
  <link rel="manifest" href="manifest.json">

  <!-- The boot splash artwork is the very first thing the user sees, so start
       downloading it while the rest of the document is still being parsed
       instead of waiting for the <img> to be reached. -->
  <link rel="preload" as="image" href="assets/assets/images/splash_bg.jpg">

  <!-- Matches the app background so the browser never flashes white while the
       Flutter bundle boots. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      overflow: hidden;
    }

    /* ---------------------------------------------------------------
       Boot splash: the FANDOM VERSE key art is shown together with a
       loading bar while the Flutter engine starts, then faded out by
       web/flutter_bootstrap.js once the app has painted.
       --------------------------------------------------------------- */
    #fv-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #05070d;
      transition: opacity 0.6s ease;
    }

    #fv-boot-splash .fv-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    #fv-boot-splash .fv-loading {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #fv-boot-splash .fv-bar-wrap {
      width: 240px;
      padding: 3px;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }

    #fv-boot-splash .fv-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
    }

    #fv-boot-splash .fv-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899);
      transition: width 0.15s ease-out;
      box-shadow: 0 0 8px #a855f7;
    }

    #fv-boot-splash .fv-text-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #fv-boot-splash .fv-text {
      margin: 0;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    #fv-boot-splash .fv-pct {
      color: #c084fc;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Branded boot splash - artwork + loading bar with live percentage -->
  <div id="fv-boot-splash">
    <img class="fv-art" src="assets/assets/images/splash_bg.jpg" alt="FANDOM VERSE" />
    <div class="fv-loading">
      <div class="fv-bar-wrap">
        <div class="fv-bar">
          <div class="fv-bar-fill" id="fv-fill"></div>
        </div>
      </div>
      <div class="fv-text-row">
        <p class="fv-text">Loading your fandom universe...</p>
        <span class="fv-pct" id="fv-pct">0%</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var cur = 0;
      var fill = document.getElementById('fv-fill');
      var pct = document.getElementById('fv-pct');
      window.__fvSetProgress = function(val) {
        cur = Math.max(cur, val);
        if (fill) fill.style.width = cur + '%';
        if (pct) pct.textContent = cur + '%';
      };
      var timer = setInterval(function() {
        if (cur < 90) {
          cur += 1;
          if (fill) fill.style.width = cur + '%';
          if (pct) pct.textContent = cur + '%';
        }
      }, 25);
      window.__fvCompleteProgress = function() {
        clearInterval(timer);
        window.__fvSetProgress(100);
      };
    })();
  </script>

  <!--
    The bootstrap script is customised in web/flutter_bootstrap.js so the
    splash above stays on screen until the app is really ready.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
