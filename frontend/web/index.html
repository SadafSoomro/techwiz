<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FANDOM VERSE - Your Fandom. All in One Place.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FANDOM VERSE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FANDOM VERSE</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload the logo for instant paint without delay -->
  <link rel="preload" as="image" href="assets/assets/images/fandom_logo.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #080612;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #fv-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #140d2b 0%, #080612 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #fv-boot-splash .fv-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      margin-bottom: 30px;
    }

    #fv-boot-splash .fv-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.45));
      animation: fv-pulse 2.2s infinite ease-in-out;
    }

    @keyframes fv-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.95; }
    }

    #fv-boot-splash .fv-title {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(168, 85, 247, 0.35);
    }

    #fv-boot-splash .fv-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.8px;
    }

    #fv-boot-splash .fv-loading {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #fv-boot-splash .fv-bar-wrap {
      width: 170px;
      padding: 2.5px;
      background: rgba(19, 17, 39, 0.85);
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.2);
    }

    #fv-boot-splash .fv-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    #fv-boot-splash .fv-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      transition: width 0.15s ease-out;
      box-shadow: 0 0 8px #a855f7;
    }

    #fv-boot-splash .fv-text-row {
      margin-top: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #fv-boot-splash .fv-text {
      margin: 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    #fv-boot-splash .fv-pct {
      color: #c084fc;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Clean Centered Brand Splash (Zero Cropping) -->
  <div id="fv-boot-splash">
    <div class="fv-center">
      <img class="fv-logo" src="assets/assets/images/fandom_logo.png" alt="FANDOM VERSE" />
      <div class="fv-title">FANDOM VERSE</div>
      <div class="fv-subtitle">Your Ultimate Fandom Universe</div>
    </div>
    <div class="fv-loading">
      <div class="fv-bar-wrap">
        <div class="fv-bar">
          <div class="fv-bar-fill" id="fv-fill"></div>
        </div>
      </div>
      <div class="fv-text-row">
        <p class="fv-text">Loading your universe...</p>
        <span class="fv-pct" id="fv-pct">0%</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var cur = 0;
      var fill = document.getElementById('fv-fill');
      var pct = document.getElementById('fv-pct');
      window.__fvSetProgress = function(val) {
        cur = Math.max(cur, val);
        if (fill) fill.style.width = cur + '%';
        if (pct) pct.textContent = cur + '%';
      };
      var timer = setInterval(function() {
        if (cur < 92) {
          cur += 1;
          if (fill) fill.style.width = cur + '%';
          if (pct) pct.textContent = cur + '%';
        }
      }, 25);
      window.__fvCompleteProgress = function() {
        clearInterval(timer);
        window.__fvSetProgress(100);
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
